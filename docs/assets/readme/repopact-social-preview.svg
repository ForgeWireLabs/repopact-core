<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">The repository is the pact</title>
  <desc id="desc">Loose fragments of engineering context become connected, durable records in a repository. The record spine connects intent, authority, decisions, work, invariants, evidence, and provenance; people and tools can resume from the same state.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1726"/>
      <stop offset="1" stop-color="#172c42"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3eb"/>
      <stop offset="1" stop-color="#e7eff7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58bca8"/>
    </marker>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .eyebrow{font:700 14px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;fill:#8fd9c7}
      .title{font:700 47px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-1.2px;fill:#f4f7fa}
      .sub{font:400 20px Inter,"Segoe UI",Arial,sans-serif;fill:#bdcad7}
      .node{font:700 16px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:.2px;fill:#153048}
      .micro{font:500 13px Inter,"Segoe UI",Arial,sans-serif;fill:#d2dee8}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#field)"/>
  <g transform="translate(0 60)">
  <path d="M0 420H1280" stroke="#30475b" stroke-width="1" opacity=".7"/>
  <text x="72" y="64" class="eyebrow">REPOPACT CORE · REPOSITORY-NATIVE GOVERNANCE</text>
  <text x="72" y="128" class="title">The repository is the pact.</text>
  <text x="72" y="165" class="sub">One durable record of what matters, who may act, and what proves the work.</text>

  <!-- Context fragments become connected repository records. -->
  <g fill="none" stroke="#91a4b5" stroke-width="2" opacity=".72">
    <path d="M128 244l62-27 37 30-45 27z"/>
    <path d="M155 305l42-26 34 22-36 28z"/>
    <path d="M211 356l35-25 38 18-35 31z"/>
    <path d="M274 228l34 26-20 28-42-23z"/>
    <path d="M300 320l37-24 35 24-29 30z"/>
  </g>
  <g fill="#8fa2b4" opacity=".68">
    <circle cx="139" cy="343" r="4"/><circle cx="319" cy="213" r="4"/><circle cx="357" cy="365" r="4"/>
    <circle cx="247" cy="203" r="3"/><circle cx="103" cy="292" r="3"/><circle cx="373" cy="266" r="3"/>
  </g>
  <text x="112" y="395" class="micro">sessions · memory · tools</text>

  <path d="M375 300C414 300 418 300 449 300" fill="none" stroke="#58bca8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="382" y="278" class="micro">made durable</text>

  <g filter="url(#shadow)">
    <rect x="470" y="202" width="410" height="198" rx="20" fill="url(#spine)" stroke="#94c9bc" stroke-width="2"/>
    <path d="M511 250V360" stroke="#247e77" stroke-width="3"/>
    <g fill="#fff" stroke="#247e77" stroke-width="2">
      <circle cx="511" cy="250" r="8"/><circle cx="511" cy="286" r="8"/><circle cx="511" cy="322" r="8"/><circle cx="511" cy="358" r="8"/>
    </g>
    <text x="540" y="256" class="node">Intent &amp; authority</text>
    <text x="540" y="292" class="node">Decisions &amp; invariants</text>
    <text x="540" y="328" class="node">Work &amp; acceptance</text>
    <text x="540" y="364" class="node">Evidence &amp; provenance</text>
    <path d="M818 222v158" stroke="#b5c4d1" stroke-width="1"/>
    <path d="M836 253h22M836 300h22M836 347h22" stroke="#247e77" stroke-width="2"/>
  </g>

  <path d="M895 300C930 300 940 300 967 300" fill="none" stroke="#58bca8" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#21384d" stroke="#68839a" stroke-width="1.5">
    <rect x="989" y="220" width="220" height="52" rx="12"/>
    <rect x="1009" y="286" width="220" height="52" rx="12"/>
    <rect x="989" y="352" width="220" height="52" rx="12"/>
  </g>
  <text x="1015" y="252" class="sub" font-size="17">Next contributor</text>
  <text x="1035" y="318" class="sub" font-size="17">Next agent</text>
  <text x="1015" y="384" class="sub" font-size="17">Next tool</text>
  <path d="M1209 246h26M1229 312h6M1209 378h26" stroke="#58bca8" stroke-width="2"/>
  <text x="72" y="478" class="eyebrow">SHARED AUTHORITY · TRACEABLE DECISIONS · REVIEWABLE EVIDENCE</text>
  <text x="1208" y="478" text-anchor="end" class="micro">HUMANS AND TOOLS RESUME FROM THE SAME STATE</text>

  </g>
</svg>
